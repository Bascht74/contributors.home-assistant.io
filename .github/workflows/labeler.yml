name: Labeler

# Labels pull requests by the files they change, using the rules in
# .github/labeler.yml. pull_request_target, so it can label pull requests
# from forks too. Safe: it never checks out or runs code from the pull
# request, the labeler reads the changed files through the API.

on: pull_request_target # zizmor: ignore[dangerous-triggers]

# One run at a time per pull request, so an older run can't undo a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    if: ${{ github.repository_owner == 'home-assistant' }}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      # Labels are only added, never removed: Renovate adds "dependencies"
      # to pull requests that only touch workflows, and syncing would take
      # it off again.
      - name: Apply labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
