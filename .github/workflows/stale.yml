name: Stale

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  stale:
    if: ${{ github.repository_owner == 'home-assistant' }}
    permissions:
      actions: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 7
          operations-per-run: 30
          remove-stale-when-updated: true
          stale-issue-label: "stale"
          exempt-issue-labels: "no-stale,help-wanted"
          stale-issue-message: >
            There hasn't been any activity on this issue recently. To keep the
            issue tracker useful, we close old issues, as many of them have
            already been resolved.

            If this issue is still relevant, please leave a comment, and it
            stays open.

            This issue has been marked as stale and will be closed if no
            further activity occurs within 7 days. Thank you for your
            contribution.
          stale-pr-label: "stale"
          exempt-pr-labels: "no-stale,help-wanted"
          stale-pr-message: >
            There hasn't been any activity on this pull request recently. It
            has been marked as stale because of that, and will be closed if no
            further activity occurs within 7 days.

            Thank you for your contribution.
