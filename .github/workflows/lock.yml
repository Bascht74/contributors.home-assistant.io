name: Lock

# Locks closed issues and pull requests after a while, so new reports go in
# a new issue instead of a comment on an old one nobody watches anymore.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  lock:
    if: ${{ github.repository_owner == 'home-assistant' }}
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: "30"
          issue-lock-reason: ""
          pr-inactive-days: "1"
          pr-lock-reason: ""
